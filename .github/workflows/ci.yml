name: CI - Build & Test

on:
  pull_request:
    branches: [Dev, QA, Production, main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore Restify.Auth/Restify.Auth.sln
          dotnet restore Restify.Core/Restify.Core.sln
          dotnet restore Restify.BackOffice/Restify.BackOffice.sln

      - name: Build
        run: |
          dotnet build Restify.Auth/Restify.Auth.sln --no-restore
          dotnet build Restify.Core/Restify.Core.sln --no-restore
          dotnet build Restify.BackOffice/Restify.BackOffice.sln --no-restore

      - name: Test
        run: |
          dotnet test Restify.Auth/Restify.Auth.sln --no-build || true
          dotnet test Restify.Core/Restify.Core.sln --no-build || true
          dotnet test Restify.BackOffice/Restify.BackOffice.sln --no-build || true
